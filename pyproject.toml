[project]
name = "lumina-commerce-ai"
version = "1.0.0"
description = "Full-stack commerce platform with a secure and observable RAG assistant"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi[standard]>=0.115,<1",
    "greenlet>=3.1,<4",
    "httpx>=0.28,<1",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "orjson>=3.10,<4",
    "pgvector>=0.3,<1",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "structlog>=24.4,<26",
    "tenacity>=9,<10",
]

[project.optional-dependencies]
eval = [
    "datasets>=3,<5",
    "langchain-community>=0.3.20,<0.4",
    "ragas>=0.4,<1",
]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.fastapi]
entrypoint = "backend.app.main:app"

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

